<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculo de Frete</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="calculator-panel" aria-labelledby="page-title">
        <div class="title-block">
          <p class="eyebrow">Simulador</p>
          <h1 id="page-title">Calculo de Frete</h1>
        </div>

        <form id="freight-form" class="freight-form">
          <label class="field">
            <span>Peso em quilos</span>
            <input
              id="weight"
              name="weight"
              type="number"
              min="0"
              step="0.1"
              placeholder="Ex.: 8.5"
              required
            />
          </label>

          <label class="field">
            <span>Regiao</span>
            <select id="region" name="region" required>
              <option value="sul">Sul</option>
              <option value="sudeste">Sudeste</option>
              <option value="centro-oeste">Centro-Oeste</option>
              <option value="norte">Norte</option>
              <option value="nordeste">Nordeste</option>
            </select>
          </label>

          <fieldset class="delivery-options">
            <legend>Tipo de entrega</legend>
            <label>
              <input type="radio" name="delivery" value="normal" checked />
              <span>Normal</span>
            </label>
            <label>
              <input type="radio" name="delivery" value="expressa" />
              <span>Expressa</span>
            </label>
          </fieldset>

          <button type="submit">Calcular frete</button>
        </form>
      </section>

      <aside class="result-panel" aria-live="polite">
        <div class="route-visual" aria-hidden="true">
          <span class="warehouse"></span>
          <span class="route-line"></span>
          <span class="destination"></span>
        </div>

        <p class="result-label">Valor final</p>
        <strong id="total-price">R$ 0,00</strong>

        <dl class="breakdown">
          <div>
            <dt>Tarifa regional</dt>
            <dd id="base-price">R$ 0,00</dd>
          </div>
          <div>
            <dt>Adicional por peso</dt>
            <dd id="weight-price">R$ 0,00</dd>
          </div>
          <div>
            <dt>Entrega expressa</dt>
            <dd id="delivery-price">R$ 0,00</dd>
          </div>
        </dl>
      </aside>
    </main>

    <script src="freight.js"></script>
    <script src="script.js"></script>
  </body>
</html>
